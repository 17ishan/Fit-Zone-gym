spring:
  application:
    name: gym-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:gym_app}
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:gym_app}
    default-schema: ${DB_SCHEMA:gym_app}
    create-schemas: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/css,text/html,application/javascript
  error:
    # Never leak internals to clients; errors are shaped by GlobalExceptionHandler.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be >= 32 chars (256-bit) for HS256. Override via APP_JWT_SECRET in every environment.
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:fitzone}
    access-token-ttl-minutes: ${APP_JWT_TTL_MINUTES:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  admin:
    # Comma-separated emails that bootstrap the first admin(s) before the allowlist table is populated.
    bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}
    # Optional: password seeded for the bootstrap admin accounts so they can log in with email/password.
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  mail:
    # When false, password-reset links are written to the log instead of emailed (handy in dev).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:FitZone <no-reply@fitzone.local>}
  frontend:
    # Base URLs used to build the password-reset link in the email, per app.
    user-url: ${FRONTEND_USER_URL:http://localhost:5173}
    admin-url: ${FRONTEND_ADMIN_URL:http://localhost:5174}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
