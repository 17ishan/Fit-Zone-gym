spring:
  application:
    name: gym-backend
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:gym_app}
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: ${DB_SCHEMA:gym_app}
    default-schema: ${DB_SCHEMA:gym_app}
    create-schemas: true
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # Fail fast if the host blocks/throttles outbound SMTP, instead of hanging a mail thread.
          connectiontimeout: ${MAIL_TIMEOUT_MS:10000}
          timeout: ${MAIL_TIMEOUT_MS:10000}
          writetimeout: ${MAIL_TIMEOUT_MS:10000}

server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,text/css,text/html,application/javascript
  error:
    # Never leak internals to clients; errors are shaped by GlobalExceptionHandler.
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # Must be >= 32 chars (256-bit) for HS256. Override via APP_JWT_SECRET in every environment.
    secret: ${APP_JWT_SECRET}
    issuer: ${APP_JWT_ISSUER:fitzone}
    access-token-ttl-minutes: ${APP_JWT_TTL_MINUTES:60}
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  admin:
    # Comma-separated emails that bootstrap the first admin(s) before the allowlist table is populated.
    bootstrap-emails: ${ADMIN_BOOTSTRAP_EMAILS:}
    # Optional: password seeded for the bootstrap admin accounts so they can log in with email/password.
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:}
  mail:
    # When false, all emails are written to the log instead of sent (handy in dev).
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:FitZone <no-reply@fitzone.local>}
    # Inbox that receives contact-form alerts. Defaults to MAIL_FROM's address when unset.
    admin-inbox: ${MAIL_ADMIN_INBOX:}
  frontend:
    # Base URLs used to build the password-reset link in the email, per app.
    user-url: ${FRONTEND_USER_URL:http://localhost:5173}
    admin-url: ${FRONTEND_ADMIN_URL:http://localhost:5174}
  notifications:
    # Master switch for the scheduled email jobs (expiry reminder, auto-expire, renewal, payments).
    enabled: ${NOTIFICATIONS_ENABLED:true}
    reminder-days-before: ${NOTIFICATIONS_REMINDER_DAYS:7,1}
    renewal-nudge-days-after: ${NOTIFICATIONS_RENEWAL_DAYS:3}
    payment-follow-up-hours: ${NOTIFICATIONS_PAYMENT_HOURS:24}
    # Daily cron schedules (server time). Override per job if needed.
    expiry-cron: ${NOTIFICATIONS_EXPIRY_CRON:0 0 8 * * *}
    expire-cron: ${NOTIFICATIONS_EXPIRE_CRON:0 10 8 * * *}
    renewal-cron: ${NOTIFICATIONS_RENEWAL_CRON:0 20 8 * * *}
    payment-cron: ${NOTIFICATIONS_PAYMENT_CRON:0 30 8 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174}
