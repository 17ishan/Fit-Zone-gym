<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#0a0a0a;">Don't lose your streak, <span th:text="${name}">there</span>!</h1>
      <p style="margin:0 0 14px;">Your <strong th:text="${planName}">Standard</strong> membership expires in
        <strong style="color:#FF0000;"><span th:text="${daysLeft}">7</span> day(s)</strong>
        on <strong th:text="${endDate}">01 Feb 2026</strong>.</p>
      <p style="margin:0 0 14px;">Renew now to keep your access uninterrupted and stay on track with your goals.</p>
      <p style="margin:0;">Keep pushing,<br/><strong>The FitZone Team</strong></p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
