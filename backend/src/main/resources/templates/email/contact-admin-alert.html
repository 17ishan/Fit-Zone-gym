<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:20px;color:#0a0a0a;">New contact submission</h1>
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr><td style="padding:6px 0;color:#888;width:90px;">Name</td><td style="padding:6px 0;font-weight:bold;" th:text="${name}">Name</td></tr>
        <tr><td style="padding:6px 0;color:#888;">Email</td><td style="padding:6px 0;" th:text="${email}">email@example.com</td></tr>
      </table>
      <p style="margin:14px 0 6px;color:#888;">Message</p>
      <div style="background:#fafafa;border:1px solid #eee;border-radius:8px;padding:14px;white-space:pre-wrap;" th:text="${message}">Message body</div>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
