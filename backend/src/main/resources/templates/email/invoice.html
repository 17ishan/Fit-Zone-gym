<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:14px;line-height:1.6;">
      <div style="display:flex;justify-content:space-between;">
        <h1 style="margin:0 0 4px;font-size:22px;color:#0a0a0a;">Invoice</h1>
      </div>
      <p style="margin:0 0 2px;color:#888;">Invoice no: <strong style="color:#222;" th:text="${invoiceNo}">INV-XXXXXXXX</strong></p>
      <p style="margin:0 0 18px;color:#888;">Date: <span th:text="${invoiceDate}">01 Jan 2026</span></p>

      <p style="margin:0 0 2px;"><strong>Billed to</strong></p>
      <p style="margin:0;" th:text="${name}">Member Name</p>
      <p style="margin:0;color:#666;" th:text="${email}">member@example.com</p>
      <p style="margin:0 0 18px;color:#666;" th:text="${address}">Address</p>

      <table style="width:100%;border-collapse:collapse;font-size:14px;border:1px solid #eee;">
        <thead>
          <tr style="background:#fafafa;">
            <th style="text-align:left;padding:10px;border-bottom:1px solid #eee;">Description</th>
            <th style="text-align:right;padding:10px;border-bottom:1px solid #eee;">Amount</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td style="padding:10px;">
              <strong th:text="${planName}">Standard</strong> membership<br/>
              <span style="color:#888;font-size:12px;"><span th:text="${periodStart}">01 Jan</span> – <span th:text="${periodEnd}">01 Feb</span></span>
            </td>
            <td style="padding:10px;text-align:right;" th:text="${amount}">₹1,499.00</td>
          </tr>
          <tr>
            <td style="padding:10px;border-top:1px solid #eee;font-weight:bold;">Total paid</td>
            <td style="padding:10px;border-top:1px solid #eee;text-align:right;font-weight:bold;color:#FF0000;" th:text="${amount}">₹1,499.00</td>
          </tr>
        </tbody>
      </table>

      <p style="margin:16px 0 0;color:#888;font-size:13px;">Payment method: <span th:text="${method}">demo</span> · Ref: <span th:text="${paymentRef}">ref</span></p>
      <p style="margin:6px 0 0;color:#888;font-size:13px;">This is a system-generated invoice and does not require a signature.</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
