<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#0a0a0a;">Welcome, <span th:text="${name}">there</span>! 💪</h1>
      <p style="margin:0 0 14px;">Your FitZone account is ready. You're one step away from a stronger, healthier you.</p>
      <p style="margin:0 0 14px;">Explore our membership plans, book classes, and track your progress right from your dashboard.</p>
      <p style="margin:0;">See you at the gym,<br/><strong>The FitZone Team</strong></p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
