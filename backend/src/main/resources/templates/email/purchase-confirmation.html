<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#0a0a0a;">You're all set, <span th:text="${name}">there</span>! 🎉</h1>
      <p style="margin:0 0 18px;">Your membership is now <strong style="color:#FF0000;">active</strong>. Here are the details:</p>
      <table style="width:100%;border-collapse:collapse;font-size:14px;">
        <tr><td style="padding:8px 0;color:#888;">Plan</td><td style="padding:8px 0;text-align:right;font-weight:bold;" th:text="${planName}">Standard</td></tr>
        <tr><td style="padding:8px 0;color:#888;">Price</td><td style="padding:8px 0;text-align:right;" th:text="${price}">₹1,499.00</td></tr>
        <tr><td style="padding:8px 0;color:#888;">Valid from</td><td style="padding:8px 0;text-align:right;" th:text="${startDate}">01 Jan 2026</td></tr>
        <tr><td style="padding:8px 0;color:#888;">Valid until</td><td style="padding:8px 0;text-align:right;" th:text="${endDate}">01 Feb 2026</td></tr>
      </table>
      <p style="margin:18px 0 0;">A separate invoice email is on its way for your records. Let's get to work! 🏋️</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
