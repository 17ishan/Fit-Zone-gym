<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#0a0a0a;">Let's finish your payment</h1>
      <p style="margin:0 0 14px;">Hi <span th:text="${name}">there</span>, we noticed a payment of
        <strong th:text="${amount}">₹1,499.00</strong> is still
        <strong style="color:#FF0000;" th:text="${status}">PENDING</strong>.</p>
      <p style="margin:0 0 14px;">Please complete it to activate your membership. If you've already paid, you can ignore this message.</p>
      <p style="margin:0;">Need help? Just reply to this email.</p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
