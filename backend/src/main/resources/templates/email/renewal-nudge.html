<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="margin:0;background:#f4f4f5;padding:24px;font-family:Arial,Helvetica,sans-serif;">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.08);">
    <div th:replace="~{email/fragments :: header}"></div>
    <div style="padding:28px 24px;color:#222;font-size:15px;line-height:1.7;">
      <h1 style="margin:0 0 12px;font-size:22px;color:#0a0a0a;">We miss you, <span th:text="${name}">there</span>! 🏋️</h1>
      <p style="margin:0 0 14px;">It's been a few days since your <strong th:text="${planName}">Standard</strong>
        membership ended (on <span th:text="${endDate}">01 Feb 2026</span>).</p>
      <p style="margin:0 0 14px;">Your goals haven't gone anywhere — and neither have we. Come back and reclaim your momentum with a fresh plan.</p>
      <p style="margin:0;">Ready when you are,<br/><strong>The FitZone Team</strong></p>
    </div>
    <div th:replace="~{email/fragments :: footer}"></div>
  </div>
</body>
</html>
