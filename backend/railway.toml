# Railway config for the FitZone Spring Boot backend.
# IMPORTANT: in the Railway service Settings, set **Root Directory = backend**
# so this file and the Dockerfile are found. Paths below are relative to that root.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/actuator/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
