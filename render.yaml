# Render Blueprint for the FitZone Spring Boot backend.
# Create the service from this file: Render Dashboard -> New -> Blueprint -> pick this repo.
# Secrets are marked `sync: false` — set their values in the Render dashboard (never commit them).
services:
  - type: web
    name: fitzone-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      # ---- Database (Supabase Postgres — use the session pooler / direct conn on 5432 so Flyway can run DDL) ----
      - key: DATABASE_URL          # jdbc:postgresql://...:5432/postgres?sslmode=require
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DB_SCHEMA
        value: gym_app
      # ---- Auth ----
      - key: APP_JWT_SECRET        # >= 32 chars
        sync: false
      - key: APP_JWT_ISSUER
        value: fitzone
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAILS
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # ---- CORS: comma-separated Vercel domains of both frontends ----
      - key: CORS_ALLOWED_ORIGINS  # https://<users>.vercel.app,https://<admin>.vercel.app
        sync: false
      # ---- Frontend base URLs (used to build password-reset links) ----
      - key: FRONTEND_USER_URL
        sync: false
      - key: FRONTEND_ADMIN_URL
        sync: false
      # ---- Email (off by default; reset links get logged) ----
      - key: MAIL_ENABLED
        value: "false"
